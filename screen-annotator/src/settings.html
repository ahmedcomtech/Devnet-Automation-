<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Screen Annotator Pro – Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <h1>Settings</h1>
      <p class="muted">Changes are saved automatically.</p>
    </header>

    <section>
      <h2>General</h2>
      <label class="row"><span>Start when I sign in</span><input type="checkbox" id="startAtLogin" /></label>
      <label class="row"><span>Draw on all displays</span><input type="checkbox" id="allDisplays" /></label>
      <label class="row"><span>Remember last tool, color and options</span><input type="checkbox" id="restoreLast" /></label>
      <div class="row">
        <span>Save screenshots and exports to</span>
        <div class="dir">
          <code id="screenshotDir"></code>
          <button id="choose-dir">Change…</button>
          <button id="open-dir">Open</button>
        </div>
      </div>
    </section>

    <section>
      <h2>Appearance</h2>
      <label class="row"><span>Toolbar opacity</span><input type="range" id="toolbarOpacity" min="0.3" max="1" step="0.02" /></label>
      <div class="row">
        <span>Palette (keys 1–8)</span>
        <div id="palette"></div>
      </div>
      <label class="row"><span>Cursor highlight color</span><input type="color" id="cursorHighlightColor" /></label>
    </section>

    <section>
      <h2>Tools</h2>
      <label class="row"><span>Laser trail length <output for="laserSeconds"></output></span><input type="range" id="laserSeconds" min="0.2" max="3" step="0.1" /></label>
      <label class="row"><span>Fading ink lasts <output for="fadeSeconds"></output></span><input type="range" id="fadeSeconds" min="1" max="15" step="0.5" /></label>
      <label class="row"><span>Spotlight radius <output for="spotlightRadius"></output></span><input type="range" id="spotlightRadius" min="40" max="600" step="10" /></label>
      <label class="row"><span>Magnifier zoom <output for="magnifierZoom"></output></span><input type="range" id="magnifierZoom" min="1.5" max="8" step="0.5" /></label>
    </section>

    <section>
      <h2>Global shortcuts</h2>
      <p class="muted">These work while any app is focused. Click a box and press a key combination; Backspace disables it.</p>
      <div id="shortcuts"></div>
    </section>

    <footer>
      <button id="reset" class="danger">Reset all settings</button>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
