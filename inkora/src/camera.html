<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:" />
    <title>Webcam</title>
    <link rel="stylesheet" href="camera.css" />
  </head>
  <body>
    <div id="frame">
      <video id="video" autoplay muted playsinline></video>
      <div id="message">Starting camera…</div>
      <div id="controls">
        <button id="shape" title="Circle / rectangle"></button>
        <button id="smaller" title="Smaller"></button>
        <button id="bigger" title="Bigger"></button>
        <button id="mirror" title="Mirror"></button>
        <button id="close" title="Close webcam"></button>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="camera.js"></script>
  </body>
</html>
